# Integración continua: compila, verifica estilo, prueba, audita dependencias y busca secretos.
# Los mismos pasos se ejecutan en local antes de cada entrega (ver docs/OPERACION.md).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secretos:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: compilar · ruff · pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar herramientas
        run: pip install -r requirements-dev.txt
      - name: Compilar todo el Python
        run: python -m compileall -q sabogal-platform sony-sgs materiales-sgs verificador-sgs devoluciones-sgs sgs-ui centro-mo agentes-pc tests
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q

  dependencias-python:
    name: pip-audit · ${{ matrix.modulo }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        modulo:
          - sabogal-platform/backend
          - sony-sgs/nuevo
          - materiales-sgs
          - verificador-sgs
          - devoluciones-sgs
          - sgs-ui
          - centro-mo
          - agentes-pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        # Informativo: los avisos conocidos y su plan están en docs/LIMITACIONES.md (#7); no bloquea la integración.
        continue-on-error: true
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r ${{ matrix.modulo }}/requirements.txt --strict --progress-spinner off

  frontend:
    name: npm ci · npm audit · build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sabogal-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sabogal-platform/frontend/package-lock.json
      - run: npm ci
      - name: npm audit
        # Informativo (docs/LIMITACIONES.md #7): react-router 6 → 7 es un cambio mayor pendiente.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  bot:
    name: bot · npm ci · npm audit · node --check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: whatsapp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
      - name: npm audit
        # Informativo (docs/LIMITACIONES.md #7): dependencias transitivas del cliente de WhatsApp.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - run: node --check index.js && node --check ecosystem.config.js
