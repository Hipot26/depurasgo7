<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Materiales Zona VII — Acceso</title>
  <style>
    :root{ --bg:#0b1220; --card:#131c2e; --line:#1f2c45; --txt:#e6edf7; --muted:#8aa0bd;
           --accent:#3b82f6; --accent2:#2563eb; --err:#ef4444; }
    *{ box-sizing:border-box; }
    body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
          background:radial-gradient(1200px 600px at 50% -10%, #16223a 0%, var(--bg) 60%);
          font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--txt); }
    .card{ width:380px; max-width:92vw; background:var(--card); border:1px solid var(--line);
           border-radius:16px; padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,.45); }
    .logo{ font-size:26px; font-weight:800; letter-spacing:.5px; }
    .logo span{ color:var(--accent); }
    .sub{ color:var(--muted); font-size:13px; margin:6px 0 22px; }
    label{ display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.5px; }
    input{ width:100%; padding:12px 14px; background:#0e1626; border:1px solid var(--line);
           border-radius:10px; color:var(--txt); font-size:15px; outline:none; }
    input:focus{ border-color:var(--accent); }
    button{ width:100%; margin-top:22px; padding:12px; border:none; border-radius:10px; cursor:pointer;
            background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:15px; font-weight:700; }
    button:hover{ filter:brightness(1.07); }
    .err{ background:rgba(239,68,68,.12); border:1px solid var(--err); color:#fecaca;
          padding:10px 12px; border-radius:10px; font-size:13px; margin-bottom:6px; }
    .foot{ text-align:center; color:var(--muted); font-size:11px; margin-top:18px; }
  </style>
</head>
<body>
  <form class="card" method="POST" autocomplete="off">
    <div class="logo">📦 Materiales <span>Zona VII</span></div>
    <div class="sub">Liquidación de materiales — análisis y seguimiento</div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label>Usuario (correo)</label>
    <input type="text" name="usuario" placeholder="usuario@correo.com" autofocus autocomplete="username">
    <label>Contraseña</label>
    <input type="password" name="password" placeholder="••••••••">
    <button type="submit">Ingresar</button>
    <div class="foot">Módulo independiente · acceso restringido</div>
  </form>
</body>
</html>
