<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}SGS UI — Presupuesto{% endblock %}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }
  .navbar { background: #1a3e2e; color: white; padding: 12px 24px;
            display: flex; align-items: center; gap: 16px; }
  .navbar .brand { font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; }
  .navbar .tag  { background: #27ae60; color: white; padding: 2px 8px;
                  border-radius: 4px; font-size: 0.7rem; font-weight: 700; }
  .navbar .tag2 { background: #f39c12; color: white; padding: 2px 8px;
                  border-radius: 4px; font-size: 0.7rem; font-weight: 700; }
  .container { max-width: 1100px; margin: 32px auto; padding: 0 16px; }
  .card { background: white; border-radius: 10px; padding: 28px;
          box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .card h2 { font-size: 1.1rem; margin-bottom: 16px; color: #1a3e2e;
             border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
  .btn { display: inline-block; padding: 10px 22px; border-radius: 6px;
         font-size: 0.9rem; font-weight: 600; cursor: pointer;
         border: none; text-decoration: none; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: #1a3e2e; color: white; }
  .btn-success { background: #27ae60; color: white; }
  .btn-danger  { background: #e74c3c; color: white; }
  .btn-light   { background: #f0f2f5; color: #1a1a2e; border: 1px solid #ddd; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px;
           font-size: 0.75rem; font-weight: 700; }
  .badge-ok      { background: #d4edda; color: #155724; }
  .badge-error   { background: #f8d7da; color: #721c24; }
  .badge-warn    { background: #fff3cd; color: #856404; }
  .badge-gray    { background: #e9ecef; color: #495057; }
  .badge-blue    { background: #cce5ff; color: #004085; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { background: #f1f8f4; padding: 10px 12px; text-align: left;
       border-bottom: 2px solid #c3e6cb; font-weight: 600; }
  td { padding: 9px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  tr:hover td { background: #f6fdf8; }
  .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem; }
  .alert-danger  { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  .alert-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
  .alert-info    { background: #cce5ff; color: #004085; border: 1px solid #b8daff; }
  .stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat { background: white; border-radius: 8px; padding: 14px 20px;
          box-shadow: 0 1px 6px rgba(0,0,0,0.07); text-align: center; min-width: 100px; }
  .stat .num { font-size: 1.8rem; font-weight: 700; }
  .stat .lbl { font-size: 0.75rem; color: #888; margin-top: 2px; }
  .stat.green .num { color: #27ae60; }
  .stat.red   .num { color: #e74c3c; }
  .stat.blue  .num { color: #2980b9; }
  .stat.gray  .num { color: #888; }
  ul.errores { margin: 4px 0 0 16px; }
  ul.errores li { color: #e74c3c; font-size: 0.82rem; }
  ul.warns  { margin: 4px 0 0 16px; }
  ul.warns  li { color: #856404; font-size: 0.82rem; }
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<div class="navbar">
  <span class="brand">SGS UI</span>
  <span class="tag">PRESUPUESTO</span>
  <span class="tag2">LIQUIDADOR 1</span>
  <span style="flex:1"></span>
  <a href="{{ url_for('subir') }}"
     style="color:rgba(255,255,255,0.7);font-size:0.8rem;text-decoration:none;margin-right:16px;">
    ← Mi sistema normal
  </a>
  <span id="pw-status-j" style="font-size:0.78rem;opacity:0.8;margin-right:10px;">
    ● Navegador inactivo
  </span>
  <form method="POST" action="{{ url_for('julian.cerrar_navegador') }}" style="margin:0;">
    <button type="submit" style="background:transparent;border:1px solid rgba(255,255,255,0.3);
            color:white;padding:4px 12px;border-radius:4px;font-size:0.75rem;cursor:pointer;">
      Cerrar navegador
    </button>
  </form>
  <button id="btn-restart" onclick="reiniciarServidor()"
          title="Reinicia el proceso Flask sin cerrar la terminal"
          style="background:transparent;border:1px solid rgba(255,165,0,0.5);
                 color:rgba(255,165,0,0.9);padding:4px 12px;border-radius:4px;
                 font-size:0.75rem;cursor:pointer;margin-left:6px;">
    ↺ Reiniciar server
  </button>
</div>
<script>
async function checkPwStatusJ() {
  try {
    const r = await fetch('{{ url_for("julian.pw_status") }}');
    const d = await r.json();
    const el = document.getElementById('pw-status-j');
    if (d.alive) {
      el.textContent = '● Navegador activo';
      el.style.color = '#2ecc71';
    } else {
      el.textContent = '● Navegador inactivo';
      el.style.color = 'rgba(255,255,255,0.6)';
    }
  } catch(e) {}
}
checkPwStatusJ();
setInterval(checkPwStatusJ, 5000);

async function reiniciarServidor() {
  const btn = document.getElementById('btn-restart');
  btn.textContent = '↺ Reiniciando…';
  btn.disabled = true;
  try {
    await fetch('/reiniciar_servidor', { method: 'POST' });
  } catch(e) {}

  await new Promise(resolve => setTimeout(resolve, 1400));

  let intentos = 0;
  const intervalo = setInterval(async () => {
    intentos++;
    try {
      const r = await fetch('/sesion_estado');
      if (r.ok) {
        clearInterval(intervalo);
        location.reload();
      }
    } catch(e) {}
    if (intentos > 25) {
      clearInterval(intervalo);
      btn.textContent = '↺ Reiniciar server';
      btn.disabled = false;
    }
  }, 800);
}
</script>
<div class="container">
  {% with msgs = get_flashed_messages() %}
    {% if msgs %}{% for m in msgs %}
      <div class="alert alert-warning">{{ m }}</div>
    {% endfor %}{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
