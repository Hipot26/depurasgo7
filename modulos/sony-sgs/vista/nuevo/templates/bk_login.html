<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso — Balance ERP</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Calibri, 'Segoe UI', Arial, sans-serif;
  background: #f0f2f5; min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.card {
  background: #fff; border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,.12);
  padding: 40px 48px; width: 380px; max-width: 95vw;
}
.logo-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.logo-icon {
  width: 42px; height: 42px; background: #1F3864;
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 17px; font-weight: bold;
}
.logo-title { font-size: 18px; font-weight: 700; color: #1F3864; }
.logo-sub   { font-size: 11px; color: #888; margin-top: 2px; }
label {
  display: block; font-size: 12px; font-weight: 600;
  color: #333; margin-bottom: 6px; margin-top: 16px;
}
input[type=text], input[type=password] {
  width: 100%; padding: 10px 14px;
  border: 1.5px solid #ccd; border-radius: 6px;
  font-size: 14px; transition: border .2s; font-family: inherit;
}
input:focus { outline: none; border-color: #1F3864; }
.btn {
  margin-top: 22px; width: 100%; padding: 12px;
  background: #1F3864; color: #fff; border: none;
  border-radius: 6px; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: background .2s;
}
.btn:hover { background: #2E75B6; }
.error {
  margin-top: 14px; padding: 10px 14px;
  background: #ffeaea; border-left: 4px solid #e53;
  border-radius: 4px; font-size: 13px; color: #c00;
}
.footer { margin-top: 24px; text-align: center; font-size: 11px; color: #bbb; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-bar">
    <div class="logo-icon">BI</div>
    <div>
      <div class="logo-title">Balance ERP</div>
      <div class="logo-sub">Acceso restringido</div>
    </div>
  </div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" autocomplete="username" autofocus>
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" autocomplete="current-password">
    <button type="submit" class="btn">Ingresar</button>
  </form>

  <div class="footer">Balance Integrado &copy; 2025</div>
</div>
</body>
</html>
